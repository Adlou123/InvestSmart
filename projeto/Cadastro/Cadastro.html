<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Cadastro.css">
    <title>Cadastro</title>
</head>
<body>
    <header>
        <h1>Cadastro</h1>
    </header>


    <form class="cadastro">
        <input class="nome" type="text" placeholder="Nome" required> <br>
        <input class="email" type="text" placeholder="E-mail" required> <br>
        <input class="cpf" type="text" placeholder="CPF" maxlength="11" required> <br>
        <input id="cep" class="cep" type="text" placeholder="CEP" onblur="pesquisacep(this.value);" required> <br>
        <input id="rua" class="endereco" type="text" placeholder="Endereço" required> <br>
        <input id="bairro" class="bairro" type="text" placeholder="Bairro" required> <br>
        <input id="cidade" class="cidade" type="text" placeholder="Cidade" required> <br>
        <input id="uf" class="uf" type="text" placeholder="UF" maxlength="2" required> <br>
        <input class="senha" type="password" placeholder="Senha" minlength="6" required> <br>
        <input class="confirmacao" type="password" placeholder="Confirmar Senha" minlength="6" required> <br>
        <button class="BTNcadastro" type="submit">Cadastrar-se</button>
        <button onclick="window.location.href='../Login/Login.html'">Voltar</button>
    </form>

  <footer class="footer">
    <div class="footer-container">

      <div class="footer-col">
        <h3>InvestSmart</h3>
        <p>Aprenda economia e investimentos de forma simples e prática.</p>
      </div>

      <div class="footer-col">
        <h4>Links</h4>
        <ul>
          <li><a href="../index.html">Início</a></li>
          <li><a href="#">Economia</a></li>
          <li><a href="#">Investimentos</a></li>
          <li><a href="simulador.html">Simulador</a></li>
        </ul>
      </div>

      <div class="footer-col">
        <h4>Contato</h4>
        <p>Email: contato@investsmart.com</p>
        <p>Telefone: (11) 99999-9999</p>
      </div>

    </div>

    <div class="footer-bottom">
      <p>© 2026 InvestSmart - Todos os direitos reservados</p>
    </div>
  </footer>
</body>
<script src="Cadastro.js"></script>

</html>
